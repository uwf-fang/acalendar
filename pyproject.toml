[tool.poetry]
name = "acalendar"
version = "0.1.1"
description = "Generate academic-term calendars as CSV, HTML, and LaTeX tables from TOML configurations"
readme = "README.md"
license = "MIT"
repository = "https://github.com/uwf-fang/acalendar"
authors = ["Ian Fang <xingang.fang@gmail.com>"]
packages = [
    { include = "acalendar", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.1.8"
tomli = "^2.2.1"
jinja2 = "^3.1.6"
python-dateutil = "^2.9.0.post0"

[tool.poetry.scripts]
calendar = 'acalendar.cli:run'

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
