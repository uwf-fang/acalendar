name: Test and package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked environment
        run: |
          python -m pip install poetry
          poetry install --no-interaction
      - name: Run calendar and CLI tests
        run: poetry run pytest -q
      - name: Build distributions
        run: poetry build
      - name: Test installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/calendar" --version
          "$RUNNER_TEMP/wheel/bin/calendar" --config "$GITHUB_WORKSPACE/calendars/cop3530_26f.toml" --csv --html --latex > wheel-calendar.txt
          test -s wheel-calendar.txt
          grep -q '<table' wheel-calendar.txt
